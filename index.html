<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Education - WhatsApp Sender</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-blue-700 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">Quality Education</h1>
            <p class="text-blue-200 text-sm mt-1">Student Broadcast Portal</p>
        </div>

        <!-- Form Area -->
        <div class="p-6">
            <div class="mb-5">
                <label for="phoneNumber" class="block text-sm font-semibold text-gray-700 mb-2">Student WhatsApp Number</label>
                <div class="flex relative rounded-md shadow-sm">
                    <span class="inline-flex items-center px-4 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm font-medium">
                        +91
                    </span>
                    <input type="tel" id="phoneNumber" class="flex-1 min-w-0 block w-full px-4 py-3 rounded-none rounded-r-md border border-gray-300 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Enter 10-digit number" maxlength="10">
                </div>
            </div>

            <div class="mb-5">
                <label for="messageText" class="block text-sm font-semibold text-gray-700 mb-2">Message Content</label>
                <!-- Default text with professional formatting and coupon code -->
                <textarea id="messageText" rows="7" class="shadow-sm block w-full focus:ring-blue-500 focus:border-blue-500 sm:text-sm border border-gray-300 rounded-md p-3 text-gray-700">Namaskar! 🙏

Quality Education ki taraf se aapke liye ek special offer! 🎉

Abhi hamare sabhi Courses aur Test Series par payein 21% ka flat discount. Apni taiyari ko aur behtar banayein.

🎟️ Coupon Code: *QEDD21*

Aaj hi is offer ka labh uthayein. Kisi bhi sahayata ke liye humse sampark karein.

Shubhkamnayein,
Quality Education</textarea>
                <p class="mt-2 text-xs text-gray-500"><i class="fas fa-info-circle mr-1"></i> WhatsApp link pre-fills text. Please attach the coupon image manually once the chat opens.</p>
            </div>

            <button onclick="sendToWhatsApp()" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors duration-200">
                <i class="fab fa-whatsapp text-xl mr-2"></i> Send Message
            </button>
        </div>
    </div>

    <!-- Instructions / Footer -->
    <div class="mt-8 text-center max-w-md text-sm text-gray-500">
        <p>This tool will open a new tab directly to the student's WhatsApp chat with the pre-written promotional message.</p>
    </div>

    <script>
        function sendToWhatsApp() {
            // Get inputs
            let phoneInput = document.getElementById('phoneNumber').value.trim();
            let messageInput = document.getElementById('messageText').value.trim();

            // Validation
            if (phoneInput.length < 10 || isNaN(phoneInput)) {
                alert("Kripya sahi 10-digit mobile number enter karein.");
                return;
            }

            // Clean number (removing spaces or special chars if any)
            let cleanPhone = phoneInput.replace(/\D/g, '');

            // Encode message for URL
            let encodedMessage = encodeURIComponent(messageInput);

            // Create WhatsApp URL (Defaults to Indian country code 91)
            let whatsappUrl = `https://api.whatsapp.com/send?phone=91${cleanPhone}&text=${encodedMessage}`;

            // Open in new tab
            window.open(whatsappUrl, '_blank');
            
            // Optional: Clear phone number input after sending for the next student
            document.getElementById('phoneNumber').value = '';
        }
    </script>
</body>
</html>
