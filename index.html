<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quality Education</title>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #c0392b; --warning: #f39c12; --info: #2980b9; --bg: #ecf0f1; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); margin: 0; padding: 20px; }
        
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .header h1 { margin: 0; font-size: 24px; }
        .btn-refresh { position: absolute; right: 20px; top: 20px; background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;}
        .btn-refresh:hover { background: #219653; }

        .dashboard { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0;}
        tr:hover { background-color: #f1f2f6; }

        /* Action Buttons for Admin */
        .action-btn { padding: 6px 10px; margin: 2px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; transition: 0.2s;}
        .btn-approve { background: var(--success); } .btn-approve:hover { background: #1e8449; }
        .btn-force-out { background: var(--danger); } .btn-force-out:hover { background: #922b21; }
        .btn-clear-break { background: #e67e22; } .btn-clear-break:hover { background: #ca6f1e; }
        .btn-end-duty { background: #8e44ad; } .btn-end-duty:hover { background: #732d91; }

        .status-badge { padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; color: white; }
        .bg-present { background: var(--success); }
        .bg-leave { background: var(--warning); color: black; }
        .bg-duty { background: #8e44ad; }
        .bg-break { background: #e67e22; }

        #loading { text-align: center; font-size: 18px; font-weight: bold; color: var(--info); padding: 20px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 Quality Education - Admin Dashboard</h1>
        <button class="btn-refresh" onclick="fetchData()">🔄 Refresh Live Data</button>
    </div>

    <div class="dashboard">
        <div id="loading">⏳ गूगल शीट से लाइव डेटा लाया जा रहा है... कृपया प्रतीक्षा करें।</div>
        <table id="adminTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Punch In</th>
                    <th>Break Time</th>
                    <th>Punch Out</th>
                    <th>Net Hours</th>
                    <th>⚙️ Admin Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

<script>
    // आपका नया Google Apps Script API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxgZYvk1mkaHXZbwcYbtM126gBlZUWGcEjIEECBklkYmtxsn1vMgvEehNSfHEsNL_jMuQ/exec";

    // 1. Google Sheet से लाइव डेटा मंगाना
    function fetchData() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('tableBody').innerHTML = '';

        fetch(API_URL)
            .then(response => response.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                if(res.status === "Success" && res.data) {
                    renderTable(res.data.reverse()); // नया डेटा ऊपर दिखाने के लिए Reverse किया
                } else {
                    alert("⚠️ डेटा लाने में समस्या हुई!");
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                alert("इंटरनेट कनेक्शन या URL में समस्या है।");
            });
    }

    // 2. टेबल को स्क्रीन पर दिखाना और बटन सेट करना
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        data.forEach(row => {
            const tr = document.createElement('tr');
            
            // Status Badge Formatting
            let statusHtml = row.status;
            if(row.status.includes('Present')) statusHtml = `<span class="status-badge bg-present">🟢 Present</span>`;
            else if(row.status.includes('Leave')) statusHtml = `<span class="status-badge bg-leave">🟡 ${row.status}</span>`;
            else if(row.status.includes('Duty')) statusHtml = `<span class="status-badge bg-duty">🏃‍♂️ On Duty</span>`;
            else if(row.status.includes('Break')) statusHtml = `<span class="status-badge bg-break">☕ On Break</span>`;

            // Admin Actions Buttons Logic
            let actionsHtml = '';
            
            // अगर लीव पर है, तो Approve का बटन
            if(row.status === 'Leave') {
                actionsHtml += `<button class="action-btn btn-approve" onclick="updateRecord('${row.date}', '${row.empId}', 'status', 'Leave (Approved ✅)')">✔️ Approve Leave</button>`;
            }
            // अगर प्रेजेंट है और पंच-आउट नहीं किया
            if(row.status === 'Present' && row.punchOut === '-') {
                actionsHtml += `<button class="action-btn btn-force-out" onclick="forcePunchOut('${row.date}', '${row.empId}', '${row.punchIn}', '${row.breakTime}')">🛑 Force Punch Out</button>`;
            }
            // अगर ब्रेक पर अटका है
            if(row.status.includes('Break')) {
                actionsHtml += `<button class="action-btn btn-clear-break" onclick="updateRecord('${row.date}', '${row.empId}', 'status', 'Present')">❌ End Break</button>`;
            }
            // अगर ट्रेनिंग/ड्यूटी पर अटका है
            if(row.status.includes('Duty')) {
                actionsHtml += `<button class="action-btn btn-end-duty" onclick="updateRecord('${row.date}', '${row.empId}', 'status', 'Present')">✅ End Duty</button>`;
            }

            if(actionsHtml === '') actionsHtml = '<span style="color:#7f8c8d; font-size:12px;">No Action Needed</span>';

            tr.innerHTML = `
                <td><strong>${row.date}</strong></td>
                <td>${row.empId}</td>
                <td>${row.name}</td>
                <td>${statusHtml}</td>
                <td>${row.punchIn}</td>
                <td>${row.breakTime}</td>
                <td>${row.punchOut}</td>
                <td><strong>${row.netHours}</strong></td>
                <td>${actionsHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 3. Google Sheet में बदलाव (Update) भेजना
    function updateRecord(date, empId, field, newValue) {
        if(!confirm(`क्या आप वाकई ${empId} का डेटा बदलना चाहते हैं?`)) return;

        document.getElementById('loading').style.display = 'block';
        
        let payload = { action: "update", date: date, empId: empId };
        payload[field] = newValue; // जो फील्ड बदलनी है, वो सेट कर दी

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            alert("✅ " + data.message);
            fetchData(); // बदलाव के बाद टेबल को फिर से रिफ्रेश करें
        });
    }

    // 4. इमरजेंसी पंच-आउट (कैलकुलेशन के साथ)
    function forcePunchOut(date, empId, punchInTimeStr, breakTimeStr) {
        if(!confirm(`क्या आप ${empId} को जबरदस्ती Punch-Out करना चाहते हैं?`)) return;

        let now = new Date();
        let punchOutStr = now.toLocaleTimeString('en-US', { hour12: true });
        
        // यह एक बेसिक इमरजेंसी अपडेट है जो एडमिन द्वारा किया जाएगा
        let payload = { 
            action: "update", 
            date: date, 
            empId: empId,
            punchOut: punchOutStr,
            netHours: "Forced Out by Admin" // एडमिन की निशानी
        };

        document.getElementById('loading').style.display = 'block';
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            alert("✅ कर्मचारी को Punch Out कर दिया गया है!");
            fetchData();
        });
    }

    // पेज खुलते ही डेटा लोड करें
    window.onload = fetchData;
</script>

</body>
</html>
