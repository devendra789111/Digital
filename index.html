<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Education - Coupon Sender</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for converting HTML to Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Custom styles for different coupon formats */
        .format-coupon {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            background: linear-gradient(135deg, #eff6ff, #bfdbfe);
        }
        .format-ticket {
            background: #f8fafc;
            border-left: 20px solid #ef4444;
            border-right: 2px solid #e2e8f0;
            border-top: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            border-radius: 8px;
            position: relative;
        }
        .format-ticket::before, .format-ticket::after {
            content: '';
            position: absolute;
            left: -10px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
        }
        .format-ticket::before { top: -10px; }
        .format-ticket::after { bottom: -10px; }
        
        .format-pass {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl flex flex-col md:flex-row gap-8">
        
        <!-- Left Side: Controls -->
        <div class="flex-1 space-y-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Quality Education</h1>
                <p class="text-sm text-gray-500">WhatsApp Offer Sender</p>
            </div>

            <!-- Student Number -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Student WhatsApp Number</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">
                        +91
                    </span>
                    <input type="text" id="phoneInput" placeholder="Enter 10 digit number" 
                        class="flex-1 block w-full rounded-none rounded-r-md border-gray-300 focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2" maxlength="10">
                </div>
            </div>

            <!-- Design Format Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Select Image Format</label>
                <select id="formatSelect" onchange="changeFormat()" class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                    <option value="format-coupon">Standard Coupon</option>
                    <option value="format-ticket">Entry Ticket</option>
                    <option value="format-pass">VIP Pass</option>
                </select>
            </div>

            <!-- Action Button -->
            <button onclick="sendToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Generate Image & Send
            </button>
            <p class="text-xs text-gray-400 text-center">Image will download automatically, then WhatsApp will open.</p>
        </div>

        <!-- Right Side: Live Preview -->
        <div class="flex-1 flex flex-col justify-center items-center">
            <h3 class="text-sm font-medium text-gray-700 mb-4 w-full text-left">Live Image Preview:</h3>
            
            <!-- This is the container that will be converted to an image -->
            <div id="coupon-preview" class="format-coupon w-full p-6 text-center shadow-sm transition-all duration-300">
                <h2 class="text-xl font-bold uppercase tracking-wide mb-1 institute-name">Quality Education</h2>
                <p class="text-sm mb-4 font-medium tagline">Learn More. Score More. Achieve More. 📚</p>
                
                <div class="bg-white/90 rounded-lg p-4 mb-4 shadow-inner">
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Use Coupon Code</p>
                    <p class="text-3xl font-extrabold text-blue-600 tracking-widest code-text">QEDD21</p>
                </div>
                
                <p class="text-lg font-bold discount-text">Flat 21% OFF</p>
                <p class="text-xs mt-1 font-medium text-gray-600">On all Courses & Test Series</p>
            </div>
        </div>

    </div>

    <script>
        // Pre-defined text message
        const messageText = `🎁 A special offer for you!

Coupon Code: QEDD21
21% OFF on Quality Education Courses & Test Series.

Learn More. Score More. Achieve More. 📚`;

        // Function to change the visual format of the coupon
        function changeFormat() {
            const select = document.getElementById('formatSelect');
            const preview = document.getElementById('coupon-preview');
            const instituteName = preview.querySelector('.institute-name');
            const codeText = preview.querySelector('.code-text');
            
            // Remove existing format classes
            preview.classList.remove('format-coupon', 'format-ticket', 'format-pass');
            
            // Add selected format class
            preview.classList.add(select.value);

            // Dynamic color adjustments based on format
            if(select.value === 'format-pass') {
                instituteName.classList.add('text-yellow-400');
                instituteName.classList.remove('text-gray-800');
                codeText.classList.add('text-yellow-500');
                codeText.classList.remove('text-blue-600');
            } else {
                instituteName.classList.remove('text-yellow-400');
                instituteName.classList.add('text-gray-800');
                codeText.classList.remove('text-yellow-500');
                codeText.classList.add('text-blue-600');
            }
        }

        // Function to download image and open WhatsApp
        async function sendToWhatsApp() {
            const phoneInput = document.getElementById('phoneInput').value;
            
            if (phoneInput.length !== 10 || isNaN(phoneInput)) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            const previewElement = document.getElementById('coupon-preview');
            
            try {
                // 1. Generate Image from the preview div using html2canvas
                const canvas = await html2canvas(previewElement, {
                    scale: 2, // High resolution
                    backgroundColor: null
                });
                
                // Convert canvas to data URL and trigger download
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = `Quality_Education_Offer_${phoneInput}.png`;
                link.href = image;
                link.click(); // Automatically downloads the image

                // 2. Open WhatsApp with pre-filled text
                const formattedNumber = "91" + phoneInput; // Assuming India country code
                const encodedMessage = encodeURIComponent(messageText);
                const whatsappUrl = `https://wa.me/${formattedNumber}?text=${encodedMessage}`;
                
                // Small delay to ensure download starts before page navigation
                setTimeout(() => {
                    window.open(whatsappUrl, '_blank');
                }, 500);

            } catch (error) {
                console.error("Error generating image: ", error);
                alert("Something went wrong while generating the image.");
            }
        }

        // Initialize the correct colors on load
        changeFormat();
    </script>
</body>
</html>
